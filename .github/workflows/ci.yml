name: Firmware-free checks
# A pull request is checked once (not also its branch's pushes), 2.x after each merge, and a change of
# documents alone not at all; a tag's checks are the release workflow's own.
on:
  push:
    branches: ['2.x']
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          persist-credentials: false
      - name: Verify runner tools
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 11)'
          cc --version
      - name: Build the host tools and run synthetic conformance
        run: bash scripts/test.sh
      - name: Shell and Python syntax
        run: |
          sh -n device/deployment/boot-report.sh
          sh -n scripts/deployment/link_identity.sh
          python3 -m compileall -q scripts tests
  mips:
    # The player's binaries from the pinned toolchain, as a release builds them: soft-float and
    # FPU-free (scripts/build.sh), with the build id of the sources' last commit (whole history).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The pinned cross toolchain
        run: docker build --platform linux/amd64 -t disc-native-toolchain -f device/Dockerfile.toolchain .
      - name: The MIPS build
        run: bash scripts/build.sh mips
      - name: The release files as a release would hold them (not a release)
        run: python3 scripts/release.py build --not-a-release --version "$(cat firmware/active-version).0-ci.${GITHUB_SHA::7}" --output dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mips-${{ github.sha }}
          path: dist/
          retention-days: 14
