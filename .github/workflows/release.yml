name: Release draft
# A tag v<firmware>.<number> (v2.57.1) builds the release files again from the pinned toolchain,
# with the installer's archive (the default server and apps downloaded by their catalog digests),
# requires them to be the recorded, guest-accepted ones (releases/<version>.json) and the
# catalog's entries for them to match, and leaves a draft release; the owner publishes it.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # Reviewed reference CI pin
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The synthetic conformance
        run: bash scripts/test.sh
      - name: The pinned cross toolchain
        run: docker build --platform linux/amd64 -t disc-native-toolchain -f device/Dockerfile.toolchain .
      - name: The MIPS build
        run: bash scripts/build.sh mips
      - name: The release files, checked against their record and the catalog
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/release.py build --version "$version" --output dist
          # The default server and apps the installer's archive holds, downloaded by their catalog digests
          # into a folder of their own (release.py installer alone found no folder to download into, v2.57.5).
          mkdir -p packages
          python3 -c "import sys; from pathlib import Path; sys.path.insert(0, 'scripts'); import release; release.bundled(sys.argv[1], Path('dist'), Path('catalog/packages.json'), [Path('dist')], Path('packages'), True)" "$version"
          python3 scripts/release.py installer --version "$version" --dist dist --from packages
          python3 scripts/release.py check --version "$version" --dist dist --notes notes.md
      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
